# Unlike [char_sets.default]'s meter_split_* (left commented out above -
# its filled-block glyph already renders as individually-inset rectangles,
# so linked/channels view doesn't need a separate glyph), this char_set's
# unified-view meter is a solid, seamlessly-connected line ("┃"/"█" render
# with no gap between repeated cells). meter_split_* here is therefore
# set to a lighter-weight glyph in the same thin-bar/block family that
# renders with a natural vertical gap between repeated cells, so a split
# view stays visually distinct from unified without changing shape.
[char_sets.compat]
default_device = "◊"
default_stream = "◊"
selector_top = "░"
selector_middle = "▒"
selector_bottom = "░"
tab_marker_left = "["
tab_marker_right = "]"
list_more = "•••"
volume_empty = "─"
volume_filled = "━"
meter_left_inactive = "┃"
meter_left_active = "┃"
meter_left_overload = "┃"
meter_right_inactive = "┃"
meter_right_active = "┃"
meter_right_overload = "┃"
meter_center_left_inactive = "█"
meter_center_left_active = "█"
meter_center_right_inactive = "█"
meter_center_right_active = "█"
meter_split_left_inactive = "❘"
meter_split_left_active = "❘"
meter_split_left_overload = "❘"
meter_split_right_inactive = "❘"
meter_split_right_active = "❘"
meter_split_right_overload = "❘"
meter_split_center_left_inactive = "▇"
meter_split_center_left_active = "▇"
meter_split_center_right_inactive = "▇"
meter_split_center_right_active = "▇"
dropdown_icon = "▼"
dropdown_selector = ">"
dropdown_more = "•••"
dropdown_border = "Plain"
help_more = "•••"
help_border = "Plain"

[char_sets.extracompat]
# Explicit inherit (unlike default/compat above) so an unset meter_split_*
# field here always falls back to this char_set's own None default,
# rather than silently picking up [char_sets.default]'s value (whatever
# it happens to be) the way an unspecified `inherit` normally would.
inherit = "extracompat"
default_device = "*"
default_stream = "*"
selector_top = "-"
selector_middle = "="
selector_bottom = "-"
tab_marker_left = "["
tab_marker_right = "]"
list_more = "~~~"
volume_empty = "-"
volume_filled = "="
meter_left_inactive = "="
meter_left_active = "#"
meter_left_overload = "!"
meter_right_inactive = "="
meter_right_active = "#"
meter_right_overload = "!"
meter_center_left_inactive = "["
meter_center_left_active = "["
meter_center_right_inactive = "]"
meter_center_right_active = "]"
# extracompat stays unset (ASCII-only, works-everywhere) here, unlike
