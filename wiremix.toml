# This file documents wiremix's configuration file. It is also itself a wiremix
# configuration file in which wiremix's default configuration is specified.
# 
# It is recommended to start with an empty configuration file and to use this
# file only as a reference. Anything specified in the configuration file will
# be merged with wiremix's defaults.


# Main Options

# PipeWire remote to connect to
#remote = "pipewire-0"

# Limit rendering frames per second (unlimited if 0.0)
fps = 60.0

# Enable mouse support
mouse = true

# Peak meter mode
# "off" - no meters
# "mono" - mono meters
# "auto" - left/right meters for stereo streams, otherwise mono
peaks = "auto"

# Character set to use (see Character Sets section)
char_set = "default"

# Theme to use (see Themes section)
theme = "default"

# Initial tab
tab = "playback"

# Which tabs are present and their order
tabs = [ "playback", "recording", "output", "input", "configuration" ]

# Maximum percentage for volume sliders
max_volume_percent = 150.0

# Whether to prevent increasing volume past max_volume
enforce_max_volume = false

# If true, only monitor peak levels of visible nodes
lazy_capture = false

# Which of the three views the app starts in - Space steps through them
# live (see view_cycle below), this only picks the startup one:
# "unified" - one collapsed bar/row per node (today's default). A volume
#   key adjusts the whole node. See unified_imbalance below for how a
#   node whose channels currently hold different values is still
#   indicated without leaving this view.
# "linked" - every node's channels get their own row, but a volume key
#   still adjusts the whole node at once: a relative key (h/l, Left/
#   Right) applies the same delta to each channel's own value, preserving
#   whatever imbalance they already had; an absolute key (0-9) sets every
#   channel to that same value.
# "channels" - same split display as "linked", but a volume key targets
#   only the individually-cursored channel, leaving every other channel
#   exactly as it was.
initial_view = "unified"

# Only consulted while the current view is "unified" - how a node whose
# channels currently hold different values is indicated without actually
# leaving that collapsed view:
# "none" - no indication, just the mean (the only behavior stock wiremix
#   has ever had).
# "cycle" (default here) - stay collapsed to one bar/row, but temporally
#   cycle the bar+percentage through each channel's own value in turn
#   while they differ (labeled with the channel's raw index, not its
#   name - "0 79%", not "FL 79%"). See unified_imbalance_cycle_seconds
#   below for how long each channel is shown.
# "split" - just that one imbalanced node renders split (see
#   split_style) while every other, balanced node stays collapsed to one
#   bar/row.
unified_imbalance = "cycle"

# How long unified_imbalance = "cycle" shows each channel before
# advancing to the next one, in seconds. Ignored otherwise. Actual
# redraws are only guaranteed at least every ~250ms, so a value well
# under that won't visibly update any faster than that floor.
unified_imbalance_cycle_seconds = 1.5

# Rendering style whenever a node's volume actually is split (view is
# "linked"/"channels", or unified_imbalance = "split" triggering for a
# currently-imbalanced node while otherwise "unified"):
# "radiating" - a node with exactly one simple stereo (or other named
#   left/right) pair and nothing else gets a single row with two bars
#   growing outward from a shared center marker. A node with more going
#   on (extra channels alongside a pair, more than one pair, e.g. a 5.1/
#   7.1 device, or no pair at all) instead gets one row per detected
#   pair/channel - a pair still radiates from a center marker on its own
#   row (labeled with its group name - see pair_label_style below), and
#   an unpaired channel occupies just the left half of that same column
#   layout (its own label/percentage/bar, with the divider and right
#   side left blank) so every row's bar starts and ends at the same
#   columns and represents the same volume-to-character scale.
# "stacked" - one row per channel, always, regardless of any pairing.
split_style = "radiating"

# Only consulted when split_style = "radiating" and more than one row
# ends up in the same node's split display (see split_style above) - a
# lone pair takes the single-row fast path above and never needs a
# label. How a radiating pair row's group label is formatted:
# "verbose" - spells out that it's a pair, e.g. "F L|R" for the FL/FR
#   pair, "R L|R" for RL/RR (today's default).
# "short" - just the group name, e.g. "F", "R".
pair_label_style = "verbose"

# Which views Action::CycleView (bound to Space by default) steps
# through, and in what order. Removing one excludes it from cycling
# without disabling it entirely - it's still reachable directly via
# Action::SelectView. Must be non-empty.
view_cycle = [ "unified", "linked", "channels" ]

# A lone stereo pair's row never shows a group label at all (unlike a
# multi-row block's own rows) - shrink its label area down to just what
# a plain percentage needs and hand the rest to the volume bars. Costs
# it a shared bar-start column with any multi-row block rows elsewhere
# in the same view. On by default.
expand_unused_label_space = true

# An unpaired channel's row in a split_style = "radiating" block
# normally occupies just the left half of the row (mirroring where a
# paired row's own left bar would be, so every row in the block lines
# up); when this is on, it stretches across the row's full remaining
# width instead. Opt-in, off by default.
expand_unpaired_channel_bars = false


# Keybindings
#
# A keybinding consists of a key, modifiers, and a UI action to be performed.
#
# Keybindings you define in your configuration will be merged with the default
# keybindings (listed below for reference). You can effectively delete a
# default keybinding by setting its action to "Nothing".
#
# A keybinding key can be one of:
# 1. A character: { Char = "x" } # for the 'x' key
# 2. An F-key: { F = 1 } # for F1
# 3. A media key: { Media = "MediaKeyCode" }
#    where MediaKeyCode is one of:
#      Play Pause PlayPause Reverse Stop FastForward Rewind TrackNext
#      TrackPrevious Record LowerVolume RaiseVolume MuteVolume
# 4. A special key: "SpecialKey"
#    where SpecialKey is one of:
#      Backspace Enter Left Right Up Down Home End PageUp PageDown Tab BackTab
#      Delete Insert Null Esc CapsLock ScrollLock NumLock PrintScreen Pause
#      Menu KeypadBegin
#
# A keybinding modifier can be one or more of SHIFT CONTROL ALT SUPER HYPER
# META NONE combined with |. It defaults to NONE if omitted.
#
# For example:
#
# keybindings = [
#  # Demonstrate modifiers
#  { key = "End", modifiers = "CTRL | ALT", action = "Exit" },
# ]
#
# Each of the available keybinding actions are documented below.
keybindings = [
 # Exit the program
 { key = { Char = "q" }, action = "Exit" },
 # Toggle mute for the selected item
 { key = { Char = "m" }, action = "ToggleMute" },
 # Make the selected item in Input/Output Devices the default endpoint
 { key = { Char = "d" }, action = "SetDefault" },
 # Increase the volume of the selected item by 1%
 { key = { Char = "l" }, action = { SetRelativeVolume = 0.01 } },
 { key = "Right", action = { SetRelativeVolume = 0.01 } },
 # Decrease the volume of the selected item by 1%
 { key = { Char = "h" }, action = { SetRelativeVolume = -0.01 } },
 { key = "Left", action = { SetRelativeVolume = -0.01 } },
 # Open a dropdown for the selected item or chose an item in the dropdown
 { key = { Char = "c" }, action = "ActivateDropdown" },
 { key = "Enter", action = "ActivateDropdown" },
 # Close an open dropdown
 { key = "Esc", action = "CloseDropdown" },
 # Select the next item
 { key = { Char = "j" }, action = "MoveDown" },
 { key = "Down", action = "MoveDown" },
 # Select the previous item
 { key = { Char = "k" }, action = "MoveUp" },
 { key = "Up", action = "MoveUp" },
 # Select the next tab
 { key = { Char = "L" }, action = "TabRight" },
 { key = "Tab", action = "TabRight" },
 # Select the previous tab
 { key = { Char = "H" }, action = "TabLeft" },
 { key = "BackTab", modifiers = "SHIFT", action = "TabLeft" },
 # Set the volume of the selected item in 10% increments from 0% to 100%
 { key = { Char = "`" }, action = { SetAbsoluteVolume = 0.00 } },
 { key = { Char = "1" }, action = { SetAbsoluteVolume = 0.10 } },
 { key = { Char = "2" }, action = { SetAbsoluteVolume = 0.20 } },
 { key = { Char = "3" }, action = { SetAbsoluteVolume = 0.30 } },
 { key = { Char = "4" }, action = { SetAbsoluteVolume = 0.40 } },
 { key = { Char = "5" }, action = { SetAbsoluteVolume = 0.50 } },
 { key = { Char = "6" }, action = { SetAbsoluteVolume = 0.60 } },
 { key = { Char = "7" }, action = { SetAbsoluteVolume = 0.70 } },
 { key = { Char = "8" }, action = { SetAbsoluteVolume = 0.80 } },
 { key = { Char = "9" }, action = { SetAbsoluteVolume = 0.90 } },
 { key = { Char = "0" }, action = { SetAbsoluteVolume = 1.00 } },
 # Open the help menu
 { key = { Char = "?" }, action = "Help" },
 # Step to the next of the three views in view_cycle (see the Main
 # Options section above) - "unified" (one collapsed bar/row) ->
 # "linked" (always split, volume keys still adjust every channel
 # together) -> "channels" (always split, volume keys target only the
 # cursored channel) -> back to "unified".
 { key = { Char = " " }, action = "CycleView" },
 # There are five actions which don't have default bindings:
 # 1. "Nothing": Do nothing - can effectively delete a default keybinding
 # 2. { SelectTab = N }: Open the Nth tab
 # 3. { SetChannelAbsoluteVolume = [N, volume] }: Set the volume of just
 #    channel N (an index into the selected item's own channels) to
 #    `volume`, leaving every other channel alone
 # 4. { SetChannelRelativeVolume = [N, delta] }: Adjust the volume of just
 #    channel N by `delta`, relative to its own current value
 # 5. { SelectView = "unified"|"linked"|"channels" }: Jump directly to one
 #    of the three views "CycleView" above steps through, regardless of
 #    view_cycle - e.g. a dedicated key straight to "channels" without
 #    cycling through "linked" first
 #
 # For example, to control the two channels of a stereo pair
 # independently with Ctrl+Left/Right (channel 0) and Ctrl+Up/Down
 # (channel 1), and jump straight to Channel mode with Ctrl+Space:
 #
 # { key = "Left", modifiers = "CONTROL", action = { SetChannelRelativeVolume = [0, -0.01] } },
 # { key = "Right", modifiers = "CONTROL", action = { SetChannelRelativeVolume = [0, 0.01] } },
 # { key = "Up", modifiers = "CONTROL", action = { SetChannelRelativeVolume = [1, 0.01] } },
 # { key = "Down", modifiers = "CONTROL", action = { SetChannelRelativeVolume = [1, -0.01] } },
 # { key = { Char = " " }, modifiers = "CONTROL", action = { SelectView = "channels" } },
 #
 # Ctrl+arrow keys aren't guaranteed to reach wiremix on every terminal -
 # some terminal emulators and multiplexers (tmux, screen) intercept them
 # first for their own tab/pane/word-jump bindings. Pick different keys
 # if these don't seem to work in your setup.
]


# Meter Layout
#
# Per-view override for how a bar/meter row lays out its volume area,
# meter area (once peaks isn't "off"), and the blank columns around
# them - independently configurable per view (see view_cycle above).
# meter_width_percent left unset (its default for all three views)
# reproduces stock wiremix's own proportional ratio, so out of the box
# every view's ratio closely matches classic wiremix. Fields are
# independent - e.g. you can pin just channels_meter_layout's
# right_margin while leaving its ratio on its classic, proportional
# default.
#
# meter_width_percent - percentage of the row's combined volume+meter
#   width given to the meter side (the volume side gets the rest). Must
#   be between 1 and 99 if set; to hide the meter entirely, use
#   peaks = "off" instead. Applied before gap/right_margin, so widening
#   either of those never costs the volume side any width.
# gap - minimum blank columns between the volume area and the meter
#   area, carved out of the meter side alone. Small by default (2,
#   universally across all three views, still overridable per view) -
#   this is a floor, not a fixed amount: the actual gap scales up above
#   it as the meter side gets more available width, rather than staying
#   visually cramped in a wide terminal.
# right_margin - blank columns reserved at the row's right edge, also
#   carved out of the meter side alone. A fixed amount (unlike gap, this
#   one doesn't scale) - small by default (3), universally across all
#   three views - still fully overridable per view, including to 0.
[unified_meter_layout]
#meter_width_percent = 50.0
gap = 2
right_margin = 3

[linked_meter_layout]
#meter_width_percent = 50.0
gap = 2
right_margin = 3

[channels_meter_layout]
#meter_width_percent = 50.0
gap = 2
right_margin = 3


# Names
#
# You can customize how streams, endpoints, and devices are named in the user
# interface using a template system to generate names based on PipeWire
# properties.
#
# Name templates are composed of property tags enclosed in { } and literal
# text. For example:
#
# "Application {client:application.name} playing {node:media.name}"
#
# wiremix will replace the property tags with the properties from the PipeWire
# object being displayed.
#
# A tag can be just a property name, like {media.name} which refers to the
# property on the object itself. Tags can also include a type prefix to refer
# to a linked object. The available type prefixes are: device, node, and
# client.
#
# Streams can have linked clients, so node and client properties are valid for
# stream. Similarly, endpoint can use either node or device properties. Only
# device properties are valid for device.
#
# You can use pw-dump(1) to inspect the available properties.
#
# Literal curly braces can be escaped by doubling them: {{ become { and }}
# becomes }.
#

# Each option in names is an array - if a template can't be resolved because it
# uses a property which doesn't exit on a given object, wiremix tries the next
# template in the sequence. If none of them can be resolved, it falls back on
# node.name for nodes or device.name for devices.
#
# The overall order of precedence for name resolution is:
# 1. Matching override templates, if any (see the Name Overrides section)
# 2. Configured templates for the object type
# 3. Fall back to the object's name property
[names]
# Streams in the Playback/Recording tabs
stream = [ "{node:node.name}: {node:media.name}" ]
# Endpoints in the Input/Output Devices tabs
endpoint = [ "{device:device.nick}", "{node:node.description}" ]
# Devices in the Configuration tab
device = [ "{device:device.nick}", "{device:device.description}" ]


# Name Overrides
#
# Name overrides define alternate templates that will be used for objects
# matching a given criterion.
#
# An override is matched by type, which contains a list of one or more of
# stream, endpoint, or device (see the Name section for more details), and
# match rules. Match rules are explained in detail in the next section.
#
# There are no default overrides, but here is an example. This causes all
# streams whose node.name is "spotify" to use just "{node:node.name}" as its
# name.
#
# [[names.overrides]]
# # Which object types this override applies to
# types = [ "stream" ]
# # The match rules
# matches = [ { "node:node.name" = "spotify" } ]
# # Templates to use when the property value matches
# templates = [ "{node:node.name}" ]
#
# You can have multiple name overrides, each in its own [[names.overrides]]
# section.


# Match Rules
#
# Match rules follow the PipeWire format (see the MATCH RULES section of
# pipewire.conf(5)), except for two differences:
#
# 1. For regular expressions, wiremix uses the syntax from the regex crate
#    (https://docs.rs/regex/latest/regex/)
#
# 2. node:/device:/client: prefixes can be used to match against properties in
#    a linked object (see the Names section above).
#
# # If any set of properties matches, the match succeeds.
# matches = [
#   # All keys in a set must match their values.
#   { "node.virtual" = "true", "media.class" = "Audio/Sink" },
#   # ~ starts a regex
#   { "media.class" = "~.*Audio.*" }
#   # ! negates a condition
#   { "node.name" = "!~my_.*" }
#   # ! can be used with or without a regular expression
#   { "client:application.process.binary" = "!firefox" }
#   # "null" matches if the property is unset
#   { "node.name" = "null" }
#   # "!null" matches if the property exists
#   { "node.name" = "!null" }
#   # Match the string "null"
#   { "node.name" = "\"null\"" }
#   # Match anything but the string "null"
#   { "node.name" = "!\"null\"" }
# ]


# Filters
#
# Filters hide objects from lists.
#
# Filters consist of a list of match rules (see Match Rules section) and an
# optional string id. The id is only used for overriding built-in filters.
#
# [[filters]]
# # Hide virtual endpoints
# matches = [ { "node.virtual" = "true", "media.class" = "Audio/Sink" } ]
#
# [[filters]]
# # Disable a built-in filter
# id = "pavucontrol-capture"
# matches = [ ]
[[filters]]
matches = [ { "node.name" = "wiremix-capture" } ]

[[filters]]
id = "pavucontrol-capture"
matches = [ { "node.name" = "PulseAudio Volume Control" } ]

[[filters]]
id = "ncpamixer-capture"
matches = [ { "node.name" = "ncpamixer" } ]


# Themes
#
# Themes determine the styling of user interface elements.
#
# Theme styles are based on ratatui's Style struct.
# https://docs.rs/ratatui/latest/ratatui/style/struct.Style.html
#
# Each style can have an fg color, a bg color, and modifiers. Any property not
# specified will inherit from the default style for your terminal.
#
# fg and bg can be an RGB hex value in the form "#RRGGBB" or named ANSI colors:
#   Black Red Green Yellow Blue Magenta Cyan Gray DarkGray LightRed LightGreen
#   LightYellow LightBlue LightMagenta LightCyan White
#
# add_modifier can be one or more of BOLD DIM ITALIC UNDERLINED SLOW_BLINK
# RAPID_BLINK REVERSED HIDDEN CROSSED_OUT combined with |.
#
# For example:
#
# # Red foreground on a black background with bold, underlined text
# { fg = "#FF0000", bg = "Black", add_modifier = "BOLD | UNDERLINE" }
#
# An empty style with no properties ({ }) corresponds to the default style.
#
# You can modify built-in themes. Anything you don't specify will remain
# unchanged. For example:
#
# # Modify the "default" theme to make the selection indicator blink.
# [themes.default]
# selector = { fg = "LightCyan", add_modifier = "SLOW_BLINK" }
#
# And you can create a new theme that inherits unspecified styles from a
# built-in theme. For example:
#
# # Create a new theme called "my_custom_theme" based on "nocolor"
# [themes.my_custom_theme]
# inherit = "nocolor"
# tab_selected = { fg = "LightCyan", add_modifier = "SLOW_BLINK" }
#
# The "inherit" option is optional. If not present, the new theme will inherit
# from the "default" theme.
#
# The following is the default theme with each themeable property described.
[themes.default]
# The symbol marking the default device on the Input/Output Devices tabs
default_device = { }
# The symbol marking the default endpoint on the Playback/Recording tabs
default_stream = { }
# The selection indicator in a tab
selector = { fg = "LightCyan" }
# The name of a tab in the tab menu
tab = { }
# The name of the selected tab in the tab menu
tab_selected = { fg = "LightCyan" }
# The symbols surrounding the selected tab in the tab menu
tab_marker = { fg = "LightCyan" }
# The symbol at the top/bottom of a tab indicating that there are more items
list_more = { fg = "DarkGray" }
# The name of a PipeWire node
node_title = { }
# The name of the selected target for a node
node_target = { }
# The volume percentage label
volume = { }
# Volume bar
volume_empty = { fg = "DarkGray" }
volume_filled = { fg = "LightBlue" }
# Peak meter. Inactive = unlit, active = lit, overload = greater than 0.0 dB
meter_inactive = { fg = "DarkGray" }
meter_active = { fg = "LightGreen" }
meter_overload = { fg = "Red" }
# The "live" indicator in the center of the meter
meter_center_inactive = { fg = "DarkGray" }
meter_center_active = { fg = "LightGreen" }
# Peak meter colors used instead of the meter_*/meter_center_* colors above
# whenever the active view is "linked" or "channels" rather than "unified"
# (see view_cycle). Unset (the default) falls back to the meter_*/
# meter_center_* color above, so a theme that hasn't opted in to a distinct
# look for linked/channels view renders identically to "unified".
# meter_split_inactive = { fg = "DarkGray" }
# meter_split_active = { fg = "LightGreen" }
# meter_split_overload = { fg = "Red" }
# meter_split_center_inactive = { fg = "DarkGray" }
# meter_split_center_active = { fg = "LightGreen" }
# The name of a device in the Configuration tab
config_device = { }
# The name of the selected profile in the Configuration tab
config_profile = { }
# Dropdown marker next to the profiles in the Configuration tab
dropdown_icon = { }
# Border around dropdowns
dropdown_border = { }
# The name of an item in a dropdown
dropdown_item = { }
# The name of the currently-selected item in a dropdown
dropdown_selected = { fg = "LightCyan", add_modifier = "REVERSED" }
# The symbol at the top/bottom of a dropdown indicating that there are more
# items
dropdown_more = { fg = "DarkGray" }
# Border around help menu
help_border = { }
# The name of an item in a the help menu
help_item = { }
# The symbol at the top/bottom of the help menu indicating that there are more
# items
help_more = { fg = "DarkGray" }


# Character Sets
#
# Character sets define the symbols used in the user interface.
#
# You can modify built-in characters sets. Anything you don't specify will
# remain unchanged. For example:
#
# # Modify the "default" character set to use parentheses around the selected
# # tab name
# [char_sets.default]
# tab_marker_left = "("
# tab_marker_right = ")"
#
# And you can create a new character set that inherits unspecified symbols from
# a built-in character set. For example:
#
# # Create a new character set called "my_custom_char_set" based on "compat"
# [char_sets.my_custom_char_set]
# inherit = "compat" # Inherit from "compat" (omit to inherit from "default")
# tab_marker_left = "("
# tab_marker_right = ")"
#
# The following is the default character set which the options described.
[char_sets.default]
# Marks the default device on the Input/Output Devices tabs
default_device = "◇"
# Marks the default endpoint on the Playback/Recording tabs
default_stream = "◇"
# The selection indicator in a tab
selector_top = "░"
selector_middle = "▒"
selector_bottom = "░"
# Surround the selected tab in the tab menu
tab_marker_left = "["
tab_marker_right = "]"
# Displayed at the top/bottom of a tab when there are more items
list_more = "•••"
# Volume bar
volume_empty = "╌"
volume_filled = "━"
# Peak meter. Inactive = unlit, active = lit, overload = greater than 0.0 dB
# Mono meters use only the right side characters
meter_left_inactive = "▮"
meter_left_active = "▮"
meter_left_overload = "▮"
meter_right_inactive = "▮"
meter_right_active = "▮"
meter_right_overload = "▮"
# The "live" indicator in the center of the meter
# Mono meters use only the right side
meter_center_left_inactive = "▮"
meter_center_left_active = "▮"
meter_center_right_inactive = "▮"
meter_center_right_active = "▮"
# Peak meter glyphs used instead of the meter_*/meter_center_* glyphs above
# whenever the active view is "linked" or "channels" rather than "unified"
# (see view_cycle) - lets a split/per-channel meter look visually distinct
# from a whole node's own "unified" meter. Unset (the default) falls back
# to the meter_*/meter_center_* glyph above, so linked/channels view
# renders with exactly the same meter glyphs as "unified" - only the
# volume bars actually splitting (and the per-channel label) indicate the
# view has changed. Mono meters use only the right/center_right side.
#meter_split_left_inactive = "❘"
#meter_split_left_active = "❘"
#meter_split_left_overload = "❘"
#meter_split_right_inactive = "❘"
#meter_split_right_active = "❘"
#meter_split_right_overload = "❘"
#meter_split_center_left_inactive = "▇"
#meter_split_center_left_active = "▇"
#meter_split_center_right_inactive = "▇"
#meter_split_center_right_active = "▇"
# Dropdown marker next to the profiles in the Configuration tab
dropdown_icon = "▼"
# Indicates the selected item in a dropdown
dropdown_selector = ">"
# Displayed at the top/bottom of a dropdown when there are more items
dropdown_more = "•••"
# Border around dropdowns
# One of "Plain", "Rounded", "Double", "Thick", "QuadrantInside",
# "QuadrantOutside"
dropdown_border = "Rounded"
# Displayed at the top/bottom of the help menu when there are more items
help_more = "•••"
# Border around help menu
# One of "Plain", "Rounded", "Double", "Thick", "QuadrantInside",
# "QuadrantOutside"
help_border = "Rounded"


# Appendix A
#
# The other built-in themes and character sets are defined for reference here.

[themes.nocolor]
default_device = { }
default_stream = { }
selector = { add_modifier = "BOLD" }
tab = { }
tab_selected = { add_modifier = "BOLD" }
tab_marker = { add_modifier = "BOLD" }
list_more = { }
node_title = { }
node_target = { }
volume = { }
volume_empty = { add_modifier = "DIM" }
volume_filled = { add_modifier = "BOLD" }
meter_inactive = { add_modifier = "DIM" }
meter_active = { add_modifier = "BOLD" }
